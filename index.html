<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão da oficina</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#16262b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#e9eeed;--surf:#fff;--ink:#16262b;--mute:#5d7076;--line:#c9d4d3;--cut:#e11d48;--ok:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--surf:#17262a;--ink:#e8f0ef;--mute:#8fa5a9;--line:#2c4247;--cut:#fb5b7f;--ok:#4fd1c0}}
:root[data-theme="dark"]{--bg:#0f1a1d;--surf:#17262a;--ink:#e8f0ef;--mute:#8fa5a9;--line:#2c4247;--cut:#fb5b7f;--ok:#4fd1c0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:640px;margin:0 auto;padding:14px 16px 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;min-width:150px}
header label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin:0}
header input{width:auto;min-height:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:640px;margin:0 auto;scrollbar-width:none}
nav button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;font-size:14px}
nav button.on{background:var(--cut);border-color:var(--cut);color:#fff}
main{max-width:640px;margin:0 auto;padding:6px 16px 60px}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 2px 8px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--cut);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;font-weight:600;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;border:1px solid var(--line);background:var(--surf);color:var(--ink)}
button.pri{background:var(--cut);border-color:var(--cut);color:#fff}
button.lk{border:0;background:none;color:var(--cut);padding:0 8px;min-height:36px}
.ord{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:0;padding-top:0}.ord:last-child{padding-bottom:0}
.ordr{text-align:right}.ordr input{width:110px;min-height:38px;padding:6px 8px;margin-right:4px}
.tot{border:2px dashed var(--cut);border-radius:14px;padding:14px;background:var(--surf);margin-bottom:12px}
.tot .big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.th{display:block;max-width:100%;max-height:160px;border-radius:8px;margin-top:8px}.th[hidden]{display:none}
.warn{color:#b45309;font-weight:600}@media (prefers-color-scheme:dark){.warn{color:#fbbf24}}
.late{color:var(--cut);font-weight:600}.in{color:var(--ok);font-weight:600}.out{color:var(--cut);font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px}
@media (min-width:900px){
header,nav,main{max-width:1240px}
header{padding:18px 24px 8px}h1{font-size:28px}
nav{flex-wrap:wrap;overflow:visible;padding:10px 24px;gap:8px;border-bottom:1px solid var(--line)}
nav button{min-height:44px;font-size:15px;padding:0 18px}
main{padding:10px 24px 80px}
.grid{grid-template-columns:repeat(4,1fr)}
.full{grid-column:1/-1}
.card,.tot{padding:18px}
.ordr input{width:130px}
.tot .big{font-size:36px}
}
@media (min-width:1500px){header,nav,main{max-width:1500px}}
</style></head><body>
<header><h1>Gestão da oficina</h1><select id="sel" aria-label="Vendedor" style="width:auto"></select><label><input type="checkbox" id="all">ver todos</label><button class="lk" id="sy" data-a="tab" data-k="cfg" style="min-height:30px"></button></header>
<nav id="nav"></nav><main id="v"></main><datalist id="cl"></datalist>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const EMP=false;const K="oficina-v1",def=()=>({sellers:[{id:1,name:"Vendedor 1"}],cur:1,biz:"",phone:"",cfg:{router:180,laser:120,margin:60},clients:[],products:[],emps:[],bills:[{id:"luz",name:"Conta de luz",items:[{id:"l1",v:0,due:"",paid:false},{id:"l2",v:0,due:"",paid:false},{id:"l3",v:0,due:"",paid:false}]}],quotes:[],orders:[],cash:[],debts:[],seq:2});
let D=def();try{const r=localStorage.getItem(K);if(r)D=Object.assign(def(),JSON.parse(r))}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert("Memória do aparelho cheia: remova fotos antigas.")}if(typeof schedSync=="function")schedSync()},$=s=>document.querySelector(s),val=i=>document.getElementById(i).value,nid=()=>{let n=Date.now()*1000+Math.floor(Math.random()*1000);if(n<=NL)n=NL+1;NL=n;return n};let NL=0;
const R=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}).replace(/\u00a0/g," ");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=s=>s?new Date(s).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const sn=i=>(D.sellers.find(s=>s.id==i)||{}).name||"";
const phoneOf=n=>(D.clients.find(c=>c.name==n)||{}).phone||"";
let OPH="",PPH="",tab="router",ALL=false,PRE=null,MON=nowL().slice(0,7);
const mine=x=>ALL||x.seller==D.cur;
const TABS=[["router","Router CNC"],["laser","Laser CO2"],["serv","Serviços"],["ped","Pedidos"],["cx","Caixa"],["cont","Contas a pagar"],["func","Funcionários"],["div","Dívidas"],["cli","Clientes"],["prod","Produtos"],["cfg","Config"]];
const QN={router:"Orçamento – Router CNC",laser:"Orçamento – Corte a laser CO2",serv:"Orçamento – Serviços prestados"};
const DR={router:{items:[],cli:"",disc:0},laser:{items:[],cli:"",disc:0},serv:{items:[],cli:"",disc:0}};
const rate=t=>t=="router"?D.cfg.router:D.cfg.laser;
const unit=(t,i)=>t=="router"?(i.h*i.c/1e4)*i.pm:t=="serv"?+i.mat:(+i.mat+(+i.min)/60*rate(t))*(1+D.cfg.margin/100);
const F=(i,l,a="",c="")=>`<div class="${c}"><label for="${i}">${l}</label><input id="${i}" ${a}></div>`;
const row=(l,r,b="")=>`<div class="ord"><div>${l}</div><div class="ordr">${r}${b}</div></div>`;
const cashAdd=(type,v,desc,dt)=>D.cash.push({id:nid(),seller:D.cur,type,v:+v,desc,dt:dt||nowL()});

function vQuote(t){
  const d=DR[t],items=d.items,sub=items.reduce((s,i)=>s+unit(t,i)*i.qty,0),fin=sub*(1-(+d.disc||0)/100),ps=D.products.filter(p=>p.t==t);
  const qs=D.quotes.filter(q=>q.t==t&&mine(q)).slice().reverse();
  return `<h2>${QN[t]}</h2><div class="card grid">
  ${F("q_cli","Cliente (cadastrado ou novo)",`list="cl" value="${esc(d.cli)}" placeholder="Digite ou escolha"`,"full")}${F("q_ph","Telefone / WhatsApp",`type="tel" inputmode="tel" value="${esc(d.ph||phoneOf(d.cli))}"`,"full")}
  ${ps.length?`<div class="full"><label for="q_p">Produto cadastrado</label><select id="q_p"><option value="">Digitar manualmente</option>${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>`:""}
  ${F("q_d","Descrição do item","","full")}
  ${F("q_qty","Quantidade",'type="number" inputmode="numeric" value="1" min="1"')}
  ${t=="router"?F("q_h","Altura (cm)",'type="number" inputmode="decimal" step="0.1"')+F("q_c","Comprimento (cm)",'type="number" inputmode="decimal" step="0.1"')+F("q_pm","Preço do m² (R$)",`type="number" inputmode="decimal" step="0.01" value="${D.cfg.m2||250}"`,"full")+'<div class="full"><label>Área e valor por unidade</label><div id="q_calc" class="big" style="font-size:22px;font-weight:800">0,00 m² · R$ 0,00</div></div>':F("q_mat",t=="serv"?"Valor (R$)":"Material por un. (R$)",'type="number" inputmode="decimal" step="0.01"')}
  ${t=="serv"||t=="router"?"":F("q_min","Tempo de máquina por un. (min)",'type="number" inputmode="decimal" step="0.1"',"full")}
  <div class="full"><label for="ph_q">Foto do serviço (opcional)</label><input id="ph_q" type="file" accept="image/*"><img id="pv_q" class="th" alt="Foto do serviço" ${d.photo?`src="${d.photo}"`:"hidden"}></div>
  <button class="full" data-a="qadd" data-t="${t}">+ Adicionar item</button></div>
  ${items.length?`<div class="card">${items.map((i,k)=>row(`<b>${esc(i.d)}</b><div class="mute">${i.qty} × ${R(unit(t,i))}${t=="router"?` · ${i.h}×${i.c} cm`:""}</div>`,`<b>${R(unit(t,i)*i.qty)}</b>`,`<button class="lk" data-a="qrm" data-t="${t}" data-i="${k}">Remover</button>`)).join("")}</div>
  <div class="tot"><div class="grid">${F("q_disc","Desconto (%)",`type="number" inputmode="decimal" value="${d.disc||0}"`)}<div><label>Total</label><div class="big">${R(fin)}</div></div></div>
  <button class="pri" style="width:100%;margin-top:10px" data-a="qsave" data-t="${t}">Salvar orçamento</button></div>`:""}
  <h2>Orçamentos salvos</h2><div class="card">${qs.length?qs.map(q=>row(`${q.photo?`<img class="th" style="max-height:60px" src="${q.photo}">`:""}<b>Nº ${q.id} · ${esc(q.cli)||"Sem nome"}</b><div class="mute">${fd(q.date)} · ${esc(sn(q.seller))}</div>`,`<b>${R(q.total)}</b>`,`<div><button class="lk" data-a="qpdf" data-i="${q.id}">PDF</button><button class="lk" data-a="q2o" data-i="${q.id}">Gerar pedido</button><button class="lk" data-a="del" data-c="quotes" data-i="${q.id}">Excluir</button></div>`)).join(""):'<span class="mute">Nenhum orçamento ainda.</span>'}</div>`;
}
function vPed(){
  const p=PRE||{},os=D.orders.filter(mine).sort((a,b)=>(a.st=="Entregue")-(b.st=="Entregue")||(a.deliver||"").localeCompare(b.deliver||""));
  const now=nowL(),late=os.filter(o=>o.st!="Entregue"&&o.deliver&&o.deliver<now).length,today=os.filter(o=>o.st!="Entregue"&&(o.deliver||"").slice(0,10)==now.slice(0,10)).length;
  return `<h2>Novo pedido</h2><div class="card grid">
  ${F("o_cli","Cliente (cadastrado ou novo)",`list="cl" value="${esc(p.cli||"")}"`,"full")}${F("o_ph","Contato do cliente",`type="tel" inputmode="tel" value="${esc(p.phone||phoneOf(p.cli))}"`,"full")}
  ${D.products.length?`<div class="full"><label for="o_p">Produto ou serviço cadastrado</label><select id="o_p"><option value="">Digitar manualmente</option>${D.products.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>`:""}
  ${F("o_desc","Produto ou serviço",`value="${esc(p.desc||"")}"`,"full")}
  ${F("o_qty","Quantidade",`type="number" inputmode="numeric" min="1" value="1"`)}<div><label for="o_pt">Tipo de preço</label><select id="o_pt"><option value="retail">Varejo</option><option value="unit">Unidade</option></select></div>
  ${F("o_tot","Valor total (R$)",`type="number" inputmode="decimal" step="0.01" value="${p.total?p.total.toFixed(2):""}"`)}
  ${F("o_sin","Sinal recebido (R$)",'type="number" inputmode="decimal" step="0.01"')}
  ${F("o_dl","Prazo máximo de entrega (dia e hora)",`type="datetime-local" value="${nowL()}"`,"full")}
  <div class="full"><label for="o_sel">Vendedor</label><select id="o_sel">${D.sellers.map(s=>`<option value="${s.id}" ${s.id==D.cur?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
  <div class="full"><label for="ph_o">Foto do produto vendido</label><input id="ph_o" type="file" accept="image/*"><img id="pv_o" class="th" alt="Foto do produto" ${OPH?`src="${OPH}"`:"hidden"}></div>
  <button class="pri full" data-a="osave">Salvar pedido</button></div>
  <h2>Entregas · ${late} atrasada(s) · ${today} para hoje</h2><div class="card">${os.length?os.map(o=>{const lt=o.st!="Entregue"&&o.deliver&&o.deliver<now;return row(`${o.photo?`<img class="th" style="max-height:70px" src="${o.photo}">`:""}<b>#${o.id} · ${esc(o.cli)}</b><div class="mute">${esc(o.phone||phoneOf(o.cli))}</div><div class="mute">${esc(o.desc)}${o.qty?` · ${o.qty} un. (${o.pt=="unit"?"preço unidade":"varejo"})`:""}</div><div class="${lt?"late":"mute"}">Prazo máx. ${fd(o.deliver)} · ${o.st}</div><div class="mute">Vendedor: ${esc(sn(o.seller))}${o.recv?` · Entregue ${fd(o.recv.at)} a ${esc(o.recv.by)}`:""}</div>`,`<b>${R(o.total)}</b><div class="mute">Saldo ${R(o.total-o.paid)}</div>`,`<div style="margin-top:4px">${o.total>o.paid?`<input id="r${o.id}" type="number" inputmode="decimal" placeholder="Receber"><button class="lk" data-a="orec" data-i="${o.id}">OK</button>`:""}</div><div>${o.st=="Produção"?`<button class="lk" data-a="st" data-i="${o.id}">Marcar pronto</button>`:o.st=="Pronto"?`<input id="e${o.id}" placeholder="Quem recebeu" style="width:130px;min-height:38px;padding:6px 8px"><button class="lk" data-a="conf" data-i="${o.id}">Confirmar entrega</button>`:""}<button class="lk" data-a="os" data-i="${o.id}">OS PDF</button><button class="lk" data-a="osimg" data-i="${o.id}">OS imagem</button><button class="lk" data-a="rec" data-i="${o.id}">Recibo</button><button class="lk" data-a="recimg" data-i="${o.id}">Recibo img</button><button class="lk" data-a="del" data-c="orders" data-i="${o.id}">Excluir</button></div>`)}).join(""):'<span class="mute">Nenhum pedido.</span>'}</div>`;
}
const cxList=()=>D.cash.filter(c=>mine(c)&&c.dt.slice(0,7)==MON).sort((a,b)=>b.dt.localeCompare(a.dt));
function vCx(){
  const l=cxList(),i=l.filter(c=>c.type=="in").reduce((s,c)=>s+c.v,0),o=l.filter(c=>c.type=="out").reduce((s,c)=>s+c.v,0);
  return `<h2>Novo lançamento</h2><div class="card grid">
  <div><label for="c_t">Tipo</label><select id="c_t"><option value="in">Entrada</option><option value="out">Saída</option></select></div>
  ${F("c_v","Valor (R$)",'type="number" inputmode="decimal" step="0.01"')}
  ${F("c_d","Descrição","","full")}${F("c_dt","Dia, mês e hora",`type="datetime-local" value="${nowL()}"`,"full")}
  <button class="pri full" data-a="csave">Lançar</button></div>
  <h2>Mês</h2><div class="card grid">${F("m_sel","Mês do relatório",`type="month" value="${MON}"`)}<button data-a="cpdf" style="align-self:end">Relatório em PDF</button></div>
  <div class="tot"><div class="row"><span>Entradas</span><b class="in">${R(i)}</b></div><div class="row"><span>Saídas</span><b class="out">${R(o)}</b></div><div class="row"><span>Saldo</span><b class="big">${R(i-o)}</b></div></div>
  <div class="card">${l.length?l.map(c=>row(`<b>${esc(c.desc)||"Sem descrição"}</b><div class="mute">${fd(c.dt)} · ${esc(sn(c.seller))}</div>`,`<b class="${c.type}">${c.type=="in"?"+":"−"} ${R(c.v)}</b>`,`<div><button class="lk" data-a="del" data-c="cash" data-i="${c.id}">Excluir</button></div>`)).join(""):'<span class="mute">Sem lançamentos neste mês.</span>'}</div>`;
}
function vDiv(){
  const l=D.debts.filter(mine),open=x=>x.total-x.paid,dv=l.filter(x=>x.kind=="D").reduce((s,x)=>s+open(x),0),hv=l.filter(x=>x.kind=="S").reduce((s,x)=>s+open(x),0);
  return `<h2>Nova nota</h2><div class="card grid">
  ${F("d_cli","Cliente (cadastrado ou novo)",'list="cl"',"full")}${F("d_desc","Descrição","","full")}
  ${F("d_v","Valor (R$)",'type="number" inputmode="decimal" step="0.01"')}
  <div><label for="d_k">Tipo</label><select id="d_k"><option value="D">Dívida (cliente deve)</option><option value="S">Sinal (haver do cliente)</option></select></div>
  <button class="pri full" data-a="dsave">Registrar</button><button class="full" data-a="dall">Relatório de todos os devedores (PDF)</button></div>
  <div class="tot"><div class="row"><span>A receber (dívidas)</span><b class="out">${R(dv)}</b></div><div class="row"><span>Haver (sinais)</span><b class="in">${R(hv)}</b></div></div>
  <div class="card">${l.length?l.map(x=>row(`<b>${esc(x.cli)}</b> <span class="mute">${x.kind=="D"?"Dívida":"Sinal (haver)"}</span><div class="mute">${esc(x.desc)} · ${fd(x.date)}</div>`,`<b>${R(open(x))}</b><div class="mute">de ${R(x.total)}</div>`,`<div>${open(x)>0?`<input id="r${x.id}" type="number" inputmode="decimal" placeholder="Valor"><button class="lk" data-a="drec" data-i="${x.id}">${x.kind=="D"?"Receber":"Abater"}</button>`:""}<button class="lk" data-a="drep" data-i="${x.id}">Relatório</button><button class="lk" data-a="del" data-c="debts" data-i="${x.id}">Excluir</button></div>`)).join(""):'<span class="mute">Nenhuma nota.</span>'}</div>`;
}
const vCli=()=>`<h2>Novo cliente fixo</h2><div class="card grid">${F("n_n","Nome","","full")}${F("n_p","Telefone / WhatsApp",'type="tel" inputmode="tel"')}${F("n_d","CPF / CNPJ")}${F("n_a","Endereço","","full")}<button class="pri full" data-a="cadd">Cadastrar</button></div>
<div class="card">${D.clients.length?D.clients.map(c=>row(`<b>${esc(c.name)}</b><div class="mute">${esc(c.phone)} ${esc(c.doc)} ${esc(c.addr)}</div>`,"",`<button class="lk" data-a="del" data-c="clients" data-i="${c.id}">Excluir</button>`)).join(""):'<span class="mute">Nenhum cliente.</span>'}</div>`;
const vProd=()=>`<h2>Novo produto</h2><div class="card grid">${F("p_n","Nome","","full")}<div><label for="p_t">Tipo</label><select id="p_t"><option value="router">Router CNC</option><option value="laser">Laser CO2</option><option value="serv">Serviço</option></select></div>${F("p_v","Valor unidade (R$)",'type="number" inputmode="decimal" step="0.01"')}${F("p_r","Valor varejo (R$)",'type="number" inputmode="decimal" step="0.01"')}${F("p_ds","Descrição","","full")}<div class="full"><label for="ph_p">Foto do produto</label><input id="ph_p" type="file" accept="image/*"><img id="pv_p" class="th" alt="Foto" hidden></div><button class="pri full" data-a="padd">Cadastrar</button></div>
<div class="card">${D.products.length?D.products.map(p=>row(`${p.photo?`<img class="th" style="max-height:60px" src="${p.photo}">`:""}<b>${esc(p.name)}</b><div class="mute">${QN[p.t].split("– ")[1]}${p.desc?" · "+esc(p.desc):""}</div>`,`<b>Un. ${R(p.price)}</b><div class="mute">Varejo ${R(p.retail||p.price)}</div>`,`<div><button class="lk" data-a="del" data-c="products" data-i="${p.id}">Excluir</button></div>`)).join(""):'<span class="mute">Nenhum produto.</span>'}</div>`;
const vCfg=()=>`${vSync()}<h2>Logo</h2><div class="card"><img id="pv_l" class="th" style="max-height:120px" src="${logo()}" alt="Logo da empresa"><label for="ph_l" style="margin-top:10px">Trocar logo</label><input id="ph_l" type="file" accept="image/*"><button class="lk" style="margin-top:6px" data-a="logoreset">Usar logo original</button></div><h2>Empresa</h2><div class="card grid">${F("f_biz","Nome da empresa",`value="${esc(D.biz)}"`,"full")}${F("f_ph","Telefone",`value="${esc(D.phone)}"`,"full")}</div>

function mkpdf(o){const J=window.jspdf&&jspdf.jsPDF;if(!J)return null;const d=new J({unit:"mm",format:"a4"}),M=16,E=194;let y=22;const t=(s,x,yy,op)=>d.text(String(s),x,yy,op);
  d.setFont("helvetica","bold");d.setFontSize(18);d.setTextColor(22,38,43);try{const L=logo(),lp=d.getImageProperties(L),k=Math.min(22/lp.width,22/lp.height);d.addImage(L,"JPEG",M,10,lp.width*k,lp.height*k)}catch(e){}t(D.biz||"Fabricio Artes CNC",M+26,y);d.setFontSize(11);d.setTextColor(225,29,72);t(o.title+(o.no?" Nº "+o.no:""),E,y,{align:"right"});
  y+=5;d.setFont("helvetica","normal");d.setFontSize(9);d.setTextColor(93,112,118);if(D.phone)t(D.phone,M+26,y);
  y=Math.max(y+3,36);d.setDrawColor(225,29,72);d.setLineWidth(.5);d.setLineDashPattern([2,1.5],0);d.line(M,y,E,y);d.setLineDashPattern([],0);
  y+=7;d.setFontSize(10);d.setTextColor(22,38,43);o.meta.forEach(m=>{t(m,M,y);y+=5.5});
  y+=3;d.setFillColor(233,238,237);d.rect(M,y-5,E-M,8,"F");d.setFont("helvetica","bold");t(o.head[0],M+2,y);t(o.head[1],125,y,{align:"right"});t(o.head[2],155,y,{align:"right"});t(o.head[3],E-2,y,{align:"right"});
  y+=8;d.setFont("helvetica","normal");
  o.rows.forEach(r=>{const l=d.splitTextToSize(String(r[0]),95);if(y+l.length*5>270){d.addPage();y=20}t(l,M+2,y);t(r[1],125,y,{align:"right"});t(r[2],155,y,{align:"right"});t(r[3],E-2,y,{align:"right"});y+=l.length*5+2;d.setDrawColor(201,212,211);d.setLineWidth(.2);d.line(M,y-1.5,E,y-1.5);y+=2});
  y+=3;if(y>250){d.addPage();y=20}
  (o.tot||[]).forEach(r=>{d.setFont("helvetica",r[2]?"bold":"normal");d.setFontSize(r[2]?13:10.5);t(r[0],125,y);t(r[1],E-2,y,{align:"right"});y+=r[2]?8:6});

function mkpng(o){const L=[[D.biz||"Fabricio Artes CNC",28,1],[o.title+(o.no?" Nº "+o.no:""),22,1],...o.meta.map(m=>[m,18,0]),["",10,0],...o.rows.map(r=>[`${r[0]}  |  ${r[1]} x ${r[2]} = ${r[3]}`,18,0]),["",10,0],...(o.tot||[]).map(r=>[r[0]+": "+r[1],r[2]?24:18,r[2]]),["",20,0],[o.foot||"",16,0]];
  const c=document.createElement("canvas"),W=900;c.width=W;c.height=Math.ceil(L.reduce((s,l)=>s+l[1]*1.6,0)+60+(o.img?340:0));const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,c.height);x.fillStyle="#16262b";let y=44;
  L.forEach(l=>{x.font=(l[2]?"bold ":"")+l[1]+"px sans-serif";x.fillText(l[0],30,y,W-60);y+=l[1]*1.6});if(!o.img)return new Promise(r=>c.toBlob(r,"image/png"));return new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.min(420/im.width,300/im.height);x.drawImage(im,30,y,im.width*s,im.height*s);c.toBlob(r,"image/png")};im.onerror=()=>c.toBlob(r,"image/png");im.src=o.img})}

      if(mode=="pull"){const ks=Object.keys(R);if(!ks.length){Object.keys(L).forEach(k=>{out[k]=L[k]})}else ks.forEach(k=>{const x=fixRec(c,JSON.parse(JSON.stringify(R[k])));out[k]=x;if(str(x)!==str(L[k]))changed=true});fin[c]=out;return}
      new Set([...Object.keys(L),...Object.keys(R),...Object.keys(Sm)]).forEach(k=>{
        const l=L[k],r=R[k],ls=str(l),rs=str(r);
        const takeL=!(first&&r!==undefined)&&hh(ls)!==Sm[k];
        if(takeL){
          if(ls!==rs)upd[c+"/"+k]=l===undefined?null:clean(l);
          if(l!==undefined){out[k]=l;NS[c][k]=hh(ls)}
        }else if(r!==undefined){
          const x=fixRec(c,JSON.parse(JSON.stringify(r)));out[k]=x;NS[c][k]=hh(str(x));if(rs!==ls)changed=true;
        }else if(l!==undefined)changed=true;
      });
      fin[c]=out;
    });
    SCAL.forEach(s=>{
      const l=clean(D[s]),r=clean(Rm[s]),ls=JSON.stringify(l),rs=JSON.stringify(r);D0[s]=ls;
      if(EMP){sc[s]=r!==undefined?r:D[s];if(r!==undefined&&rs!==ls)changed=true;return}
      const takeL=!(first&&r!==undefined)&&hh(ls)!==S[s];
      if(takeL){if(ls!==rs)upd[s]=l===undefined?null:l;sc[s]=D[s];NS[s]=hh(ls)}
      else if(r!==undefined){sc[s]=r;NS[s]=hh(rs);if(rs!==ls)changed=true}
      else{sc[s]=D[s];NS[s]=hh(ls)}
    });
    if(Object.keys(upd).length){
      const reqs=[];
      if(!EMP)reqs.push([FB.db+"/oficina.json",upd]);
      else{const g={};Object.keys(upd).forEach(p=>{const i=p.indexOf("/"),c=p.slice(0,i),k=p.slice(i+1);(g[c]=g[c]||{})[k]=upd[p]});Object.keys(g).forEach(c=>reqs.push([FB.db+"/oficina/"+c+".json",g[c]]))}
      for(const[u,b]of reqs){
        const p=await fetch(u+"?auth="+encodeURIComponent(t),{method:"PATCH",body:JSON.stringify(b)});
        if(!p.ok){if(p.status==401||p.status==403){const e=new Error("rules");e.rules=true;throw e}throw new Error("patch "+p.status)}
      }
    }
    ACT.forEach(c=>{
      const cur=byId(D[c]),o=fin[c];
      new Set([...Object.keys(cur),...Object.keys(D0[c])]).forEach(k=>{
        if(str(cur[k])!==D0[c][k]){if(cur[k]===undefined)delete o[k];else o[k]=cur[k]}
      });
      D[c]=Object.values(o).sort((a,b)=>(+a.id||0)-(+b.id||0));
    });
    SCAL.forEach(s=>{if(JSON.stringify(clean(D[s]))===D0[s]){if(sc[s]===undefined)delete D[s];else D[s]=sc[s]}});
    if(!D.sellers.some(x=>x.id==D.cur)&&D.sellers[0])D.cur=D.sellers[0].id;
    SN=NS;
    try{localStorage.setItem(K,JSON.stringify(D));localStorage.setItem(SY+"snap",JSON.stringify(SN))}catch(e){}
    setSt("● Sincronizado "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    needRender=needRender||changed;
  }catch(e){
    if(e.fatal){AU=null;SN=null;try{localStorage.removeItem(SY+"auth");localStorage.removeItem(SY+"snap")}catch(_){}setSt("Só neste aparelho");showLogin("Sessão expirada. Entre novamente.")}
    else setSt(e.rules?"● Sem permissão (veja as regras do banco)":"● Sem conexão – alterações guardadas");
  }
  syncing=false;
  if(needRender){const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){needRender=false;render()}}
  if(again){again=false;schedSync()}
}
function showLogin(msg){
  let o=document.getElementById("lg");
  if(!o){o=document.createElement("div");o.id="lg";o.style.cssText="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto";document.body.appendChild(o)}
  o.innerHTML=`<div class="card" style="width:100%;max-width:380px"><div style="text-align:center"><img src="${logo()}" style="height:90px;border-radius:12px" alt="Logo"></div><h2 style="margin-top:12px">Entrar</h2><div class="grid"><div class="full"><label for="lg_e">E-mail</label><input id="lg_e" type="email" autocomplete="username"></div><div class="full"><label for="lg_p">Senha</label><input id="lg_p" type="password" autocomplete="current-password"></div><div class="full late" id="lg_m">${esc(msg||"")}</div><button class="pri full" data-a="dologin">Entrar</button><button class="full" data-a="skip">Usar só neste aparelho</button></div></div>`;
  const p=document.getElementById("lg_p");p.addEventListener("keydown",e=>{if(e.key=="Enter")doLogin()});
}
async function doLogin(){
  const e=val("lg_e").trim(),p=val("lg_p"),m=document.getElementById("lg_m");
  if(!e||!p){m.textContent="Preencha e-mail e senha.";return}
  m.textContent="Entrando…";
  try{
    const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+FB.key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});
    const j=await r.json();
    if(!r.ok){const c=(j.error&&j.error.message)||"";m.textContent=/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS|INVALID_EMAIL/.test(c)?"E-mail ou senha incorretos.":/TOO_MANY/.test(c)?"Muitas tentativas. Aguarde alguns minutos.":/OPERATION_NOT_ALLOWED/.test(c)?"O login por e-mail e senha não está ativado no Firebase.":"Não foi possível entrar ("+c+").";return}
    AU={email:j.email,idToken:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000};saveAu();
    const o=document.getElementById("lg");if(o)o.remove();
    if(tab=="cfg")render();
    sync();
  }catch(x){m.textContent="Sem conexão com a internet. Entre pela primeira vez com internet."}
}
const vSync=()=>`<h2>Conta e sincronização</h2><div class="card grid">${AU?`<div class="full">Conectado como <b>${esc(AU.email)}</b></div><div class="full mute">Os dados são compartilhados com todos os usuários que entrarem com login.</div><button class="pri" data-a="syncnow">Sincronizar agora</button><button data-a="logout">Sair da conta</button>`:`<div class="full mute">Sem login, os dados ficam só neste aparelho.</div><button class="pri full" data-a="showlogin">Entrar para sincronizar</button>`}</div>`;
Object.assign(A,{
  dologin:()=>doLogin(),
  skip:()=>{try{localStorage.setItem(SY+"skip","1")}catch(e){}const o=document.getElementById("lg");if(o)o.remove()},
  showlogin:()=>showLogin(),
  syncnow:()=>sync(),
  logout:()=>{if(!confirm("Sair da conta? Os dados continuam neste aparelho, mas deixam de sincronizar."))return;AU=null;SN=null;try{localStorage.removeItem(SY+"auth");localStorage.removeItem(SY+"snap")}catch(e){}setSt("Só neste aparelho");render()}
});
setSt(AU?"● Conectando…":"Só neste aparelho");
if(!AU&&!ld("skip"))showLogin();
if(AU)sync();
setInterval(()=>{if(AU&&!document.hidden&&navigator.onLine)sync()},15000);
addEventListener("online",()=>sync());

render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
